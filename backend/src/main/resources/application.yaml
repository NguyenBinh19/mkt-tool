server:
  port: 8080
spring:
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/leadflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}"
    driverClassName: "${DB_DRIVER:com.mysql.cj.jdbc.Driver}"
    username: "${DB_USERNAME:leadflow}"
    password: "${DB_PASSWORD:leadflow_secret}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
logging:
  level:
    org.springframework: INFO
facebook:
  # A persistent browser profile is used so you can sign in manually once.
  # Do not put Facebook credentials in this file.
  profile-directory: ${FACEBOOK_PROFILE_DIRECTORY:../playwright-profile}
  headless: ${FACEBOOK_HEADLESS:true}
  navigation-timeout-ms: 45000
  max-comments-limit: 1000
