server:
  port: 8080
  forward-headers-strategy: framework
spring:
  datasource:
    url: "${DB_URL}"
    driverClassName: com.mysql.cj.jdbc.Driver
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
facebook:
  profile-directory: "${FACEBOOK_PROFILE_DIRECTORY:/app/playwright-profile}"
  headless: "${FACEBOOK_HEADLESS:true}"
  navigation-timeout-ms: 45000
  max-comments-limit: 1000
